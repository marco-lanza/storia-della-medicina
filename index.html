<!DOCTYPE html>
<html lang="it">
<head>

    :root { --bg1: #f8d9eb; --bg2: #e3d9f8; --bg3: #d9f0f8; }

      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;

      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; color:#222;
    }
    .app { width: min(1000px, 95%); padding: 28px; display:flex; flex-direction:column; gap:22px; }
    header { text-align:center; }
    header h1 { font-size:2rem; margin:0; }
    .glass {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(18px);
      border-radius:24px;
      padding:24px;
      box-shadow:0 8px 24px rgba(0,0,0,0.25), 0 0 12px rgba(255,255,255,0.5);
      text-align:center;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .btn {
      padding:14px 28px;
      border:none; border-radius:20px;
      cursor:pointer;
      background:rgba(255,255,255,0.75);
      color:#222;
      margin:12px;
      font-weight:600;
      transition:all .3s ease;
      font-size:1rem;
    }
    .btn:hover { background:#fff; transform:scale(1.05); }
    .option {
      background: rgba(255,255,255,0.35);
      margin:10px 0;
      padding:14px;
      border-radius:16px;
      cursor:pointer;
      transition: all .3s ease;
    }
    .option:hover { background: rgba(255,255,255,0.55); }
    .option.correct { background: rgba(144,238,144,0.6) !important; animation: pop 0.4s ease; }
    .option.wrong { background: rgba(255,127,127,0.6) !important; animation: shake 0.4s ease; }
    @keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }
    @keyframes shake { 0%{transform:translateX(0);} 25%{transform:translateX(-5px);} 50%{transform:translateX(5px);} 75%{transform:translateX(-5px);} 100%{transform:translateX(0);} }
    .explanation { margin-top:15px; text-align:left; color:#222; font-size:15px; }
    .mascotte { font-size:72px; animation: dance 1s infinite; margin: 16px; text-align:center; }
    @keyframes dance { 0% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-8deg) scale(1.05); } 50% { transform: rotate(0deg) scale(1); } 75% { transform: rotate(8deg) scale(1.05); } 100% { transform: rotate(0deg) scale(1); } }
    #answersList { text-align:left; margin-top:20px; }
    .answer-item { margin-bottom:16px; padding:12px; border-radius:12px; background: rgba(255,255,255,0.3); }
    .answer-item strong { display:block; margin-bottom:6px; }
    .status {
      display:inline-flex; align-items:center; justify-content:center;
      width:26px; height:26px;
      border-radius:50%;
      font-size:16px;
      font-weight:bold;
      color:#fff;
      margin-right:8px;
    }
    .status.correct { background:#34c759; } /* iOS green */
    .status.wrong { background:#ff3b30; }   /* iOS red */
    .progress-bar-container { width: 100%; background: rgba(0,0,0,0.1); border-radius: 12px; height: 16px; margin-bottom: 16px; overflow:hidden; }
    .progress-bar { height: 100%; width: 0%; background: #333; transition: width 0.4s ease; border-radius: 12px; }
    .circle-progress { position: relative; width: 150px; height: 150px; margin: 0 auto 20px; }
    .circle-progress svg { transform: rotate(-90deg); }
    .circle-progress circle { fill: none; stroke-width: 12; stroke-linecap: round; }
    .circle-bg { stroke: rgba(0,0,0,0.1); }
    .circle-bar { stroke: #333; stroke-dasharray: 440; stroke-dashoffset: 440; transition: stroke-dashoffset 1s ease; }
    .circle-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.5rem; font-weight:bold; }
    .start-info { font-size:1.1rem; margin:10px 0; text-align:center; }
    .btn-row { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; }
    .number-box { display:flex; justify-content:center; align-items:center; margin-top:10px; gap:10px; }
    #howmany { width:80px; padding:10px; border-radius:12px; border:none; font-size:1rem; text-align:center; -moz-appearance:textfield; }
    #howmany::-webkit-outer-spin-button, #howmany::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    .stepper-btn {
      width:40px; height:40px;
      border-radius:50%;
      border:none;
      background:rgba(255,255,255,0.75);
      font-size:1.4rem;
      font-weight:bold;
      cursor:pointer;
      transition:all .3s ease;
    }
    .stepper-btn:hover { background:#fff; transform:scale(1.1); }
    #nextBtn { display:none; }

</head>

    const ALL=QUESTIONS;
    document.getElementById('totalCount').textContent=ALL.length;
    let picked=[],correctSoFar=0,index=0,answers=[],answered=false;
    function start(){ const n=Math.min(parseInt(document.getElementById('howmany').value)||ALL.length,ALL.length);
      picked=[...ALL].sort(()=>Math.random()-0.5).slice(0,n); index=0; correctSoFar=0; answers=[]; answered=false;
      document.getElementById('start').style.display='none'; document.getElementById('quiz').style.display='block';
      document.getElementById('result').style.display='none'; showQ();}
    function updateProgress(){ const pct=((index)/picked.length)*100; document.getElementById('progress').style.width=pct+'%'; }
    function showQ(){ if(index>=picked.length){ return showResult(); } updateProgress(); const q=picked[index];
      const opts=[...q.opts].sort(()=>Math.random()-0.5); const content=document.getElementById('quizContent');
      content.innerHTML=`<h2>${q.q}</h2>`+opts.map(o=>`<div class='option'>${o}</div>`).join('')+`<div class='explanation' id='expl'></div>`;
      document.getElementById('nextBtn').style.display='none'; answered=false;
      [...document.querySelectorAll('.option')].forEach(el=>{ el.onclick=()=>{ if(answered) return; answered=true; const correct=q.opts[0]; const chosen=el.textContent; const expl=q.expl; const isCorrect = chosen===correct;
          if(isCorrect) el.classList.add('correct'); else el.classList.add('wrong'); document.querySelectorAll('.option').forEach(opt=>{ if(opt.textContent===correct) opt.classList.add('correct'); }); document.getElementById('expl').innerText=expl;
          if(isCorrect) correctSoFar++; answers.push({question:q.q, chosen, correct, isCorrect, expl}); document.getElementById('nextBtn').style.display='inline-block'; }; }); }
    document.getElementById('nextBtn').onclick=()=>{ index++; showQ(); };
    function showResult(){ document.getElementById('quiz').style.display='none'; document.getElementById('progress').style.width='100%'; const pct=Math.round(100*correctSoFar/picked.length);
      document.getElementById('circleText').textContent=pct+'%'; const circleBar=document.getElementById('circleBar'); const offset=440 - (440*pct/100); circleBar.style.strokeDashoffset=offset;
      document.getElementById('verdict').textContent=pct<50?'Da ripassare':pct<70?'Ci sei quasi':pct<90?'Ottimo!':'Perfetto!'; const masc=document.getElementById('mascotte'); if(pct<50) masc.textContent='😢'; else if(pct<70) masc.textContent='😐'; else if(pct<90) masc.textContent='😊'; else masc.textContent='🤩';
      const list=document.getElementById('answersList'); list.innerHTML='<h3>Le tue risposte:</h3>' + answers.map(a=> `<div class='answer-item'> <span class='status ${a.isCorrect?"correct":"wrong"}'>${a.isCorrect?"✔︎":"✘"}</span> <strong>${a.question}</strong><br> La tua risposta: ${a.chosen}<br> Corretta: ${a.correct}<br> <em>Spiegazione: ${a.expl}</em> </div>`).join('');
      document.getElementById('result').style.display='block';}
    document.getElementById('startBtn').onclick=start; document.getElementById('restartBtn').onclick=()=>{ document.getElementById('start').style.display='block'; document.getElementById('result').style.display='none'; };
    document.getElementById('retryWrongBtn').onclick=()=>{ picked=answers.filter(a=>!a.isCorrect).map(a=>({q:a.question,opts:[a.correct,...ALL.find(q=>q.q===a.question).opts.filter(o=>o!==a.correct)],expl:a.expl})); index=0; correctSoFar=0; answers=[]; answered=false;
      document.getElementById('result').style.display='none'; document.getElementById('quiz').style.display='block'; showQ(); };

    // Stepper logic
    const input=document.getElementById('howmany');
    document.getElementById('increase').onclick=()=>{ let v=parseInt(input.value)||1; if(v<ALL.length) input.value=v+1; };
    document.getElementById('decrease').onclick=()=>{ let v=parseInt(input.value)||1; if(v>1) input.value=v-1; };
  </script>
